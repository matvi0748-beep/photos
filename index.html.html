<style>
  /* Общие стили контейнера */
  .photo-card-container {
    display: flex;
    justify-content: center;
    padding: 40px 20px;
    background-color: #fcfcfc; /* Светлый нейтральный фон */
  }

  /* Стили карточки */
  .photo-card {
    background: #ffffff;
    max-width: 450px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    border: 1px solid #eaeaea;
    transition: all 0.4s ease;
  }

  .photo-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
    border-color: #d1d1d1;
  }

  /* Wrapper для зум-эффекта картинки */
  .image-wrapper {
    width: 100%;
    overflow: hidden;
    aspect-ratio: 4 / 3; /* Удерживает аккуратные пропорции */
    background-color: #f0f0f0;
  }

  .portfolio-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
  }

  .photo-card:hover .portfolio-img {
    transform: scale(1.05); /* Легкое плавное увеличение */
  }

  /* Текстовый блок под фото */
  .card-info {
    padding: 24px;
    text-align: left;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #888888;
    margin-bottom: 8px;
  }

  .title {
    font-size: 20px;
    font-weight: 600;
    color: #111111;
    margin: 0 0 10px 0;
  }

  .description {
    font-size: 14px;
    line-height: 1.6;
    color: #666666;
    margin: 0;
  }
</style>
